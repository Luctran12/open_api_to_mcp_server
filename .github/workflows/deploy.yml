# Tên workflow
name: CI/CD for open-api-to-mcp-server

on:
  push:
    branches: [ luc ] # Kích hoạt khi push lên nhánh 'luc'

# Cấp quyền cho job để "write" (đẩy) image lên GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest 

    steps:
      # 1. Lấy code về máy ảo của GitHub Actions
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Đăng nhập vào GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: luctran12 # github username in lowercase
          password: ${{ secrets.GITHUB_TOKEN }} # Token này được GitHub tự động cấp

      # 3. Build và đẩy Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tên image sẽ là: ghcr.io/TEN_CUA_BAN/open-api-to-mcp-server:latest
          tags: ghcr.io/luctran12/open-api-to-mcp-server:latest

      # 4. SSH vào VM Azure và thực hiện deploy
      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Dùng các secret bạn đã tạo (SSH_PRIVATE_KEY, SERVER_HOST, SERVER_USER)
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Đi đến thư mục dự án (để lấy file .env)
            cd /home/ubuntu/open_api_to_mcp_server
            
            # 2. Đặt biến cho dễ quản lý
            IMAGE_NAME="ghcr.io/luctran12/open-api-to-mcp-server:latest"
            CONTAINER_NAME="open-api-to-mcp-server"
            
            # 3. Đăng nhập Docker vào GHCR (bắt buộc trên VM)
            #    (GITHUB_TOKEN cần được tạo và lưu trong secret tên là GHCR_TOKEN)
            #    LƯU Ý: Bạn cần tạo một Personal Access Token (classic) với quyền 'read:packages' 
            #    và lưu nó vào secret tên là GHCR_TOKEN
            echo ${{ secrets.GHCR_TOKEN }} | sudo docker login ghcr.io -u luctran12 --password-stdin

            # 4. Pull image mới nhất từ GHCR
            sudo docker pull $IMAGE_NAME
            
            # 5. Dừng container cũ
            sudo docker stop $CONTAINER_NAME || true
            
            # 6. Xóa container cũ
            sudo docker rm $CONTAINER_NAME || true
            
            # 7. Chạy container mới
            #    Nó sẽ dùng file .env trong thư mục hiện tại
            sudo docker run -d \
              --env-file .env \
              -p 8080:8080 \
              --restart always \
              --name $CONTAINER_NAME \
              $IMAGE_NAME
              
            # 8. Dọn dẹp image cũ
            sudo docker image prune -f